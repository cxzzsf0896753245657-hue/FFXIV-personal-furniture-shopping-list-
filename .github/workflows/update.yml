name: Update FF14 Furniture Data

on:
  schedule:
    # 每月1日 UTC 02:00（台灣時間 10:00）自動執行
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '強制全量更新（重新抓取所有資料與圖示）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      no_icons:
        description: '跳過圖示下載（只更新 JSON）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 push 回 repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Run update script
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.no_icons }}" = "true" ]; then
            ARGS="$ARGS --no-icons"
          fi
          python scripts/update_furniture.py $ARGS

      - name: Check for changes
        id: changes
        run: |
          git add data/ icons/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')
          git commit -m "chore: auto-update furniture data [${TIMESTAMP} CST]"
          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "資料無變動，不需提交。"
