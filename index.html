<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 家具辨識器</title>
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1825;
    --surface2: #231f32;
    --border: #2e2a42;
    --accent: #c9a96e;
    --accent2: #7b6ea0;
    --text: #e8e4f0;
    --text-muted: #8a849e;
    --success: #6ecaa0;
    --error: #ca6e7b;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Consolas', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }

  header .crystal {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    flex-shrink: 0;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: normal;
    letter-spacing: 0.04em;
    color: var(--accent);
  }

  header p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* ── Layout ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 800px) {
    .main { grid-template-columns: 1fr; }
  }

  /* ── Panel ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .panel-title {
    padding: 14px 20px;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    font-family: var(--font-mono);
  }

  /* ── Upload zone ── */
  .upload-area {
    padding: 24px 24px 0;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  .drop-zone.has-image {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
    border-style: solid;
    border-color: var(--accent2);
  }

  .drop-zone.has-image .drop-hint-full { display: none; }
  .drop-zone.has-image .drop-hint-mini { display: flex !important; }

  .drop-hint-mini {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .drop-hint-mini strong { color: var(--accent); }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(201, 169, 110, 0.05);
  }

  .drop-zone input {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .drop-zone .icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
    filter: grayscale(0.3);
  }

  .drop-zone p { color: var(--text-muted); font-size: 0.875rem; }
  .drop-zone strong { color: var(--accent); }

  /* ── Paste hint toast ── */
  #paste-hint {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--accent2);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 0.82rem;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  #paste-hint.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── Preview image ── */
  #preview-wrap {
    display: none;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }

  #preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    background: var(--surface2);
  }

  #preview-header span { color: var(--accent); }

  #preview-header button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.78rem;
    cursor: pointer;
    padding: 2px 6px;
  }

  #preview-header button:hover { color: var(--error); }

  #preview-canvas-wrap {
    overflow: auto;
    max-height: 320px;
    background: #080710;
  }

  #preview-wrap canvas {
    display: block;
    /* show at natural size so every pixel is visible, scroll if needed */
    max-width: 100%;
    height: auto;
  }

  /* ── Controls ── */
  .controls {
    padding: 16px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px; }

  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }

  .slider-row {
    display: flex; align-items: center; gap: 10px;
  }

  .slider-val {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--accent);
    min-width: 24px;
    text-align: right;
  }

  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 0.875rem;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 5px;
    font-size: 0.9rem;
    padding: 10px 20px;
    transition: opacity 0.15s, transform 0.1s;
  }

  button:hover { opacity: 0.88; }
  button:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--accent);
    color: #0f0e17;
    font-weight: 600;
    width: 100%;
    padding: 12px;
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    width: 100%;
  }

  /* ── Status bar ── */
  #status {
    padding: 10px 20px;
    font-size: 0.8rem;
    font-family: var(--font-mono);
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #status.loading { color: var(--accent); }
  #status.error   { color: var(--error); }
  #status.ok      { color: var(--success); }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* ── Results panel ── */
  .results-area { padding: 20px; }

  /* summary chips */
  .summary-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 20px;
  }

  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .chip span { color: var(--accent); font-weight: 600; }

  /* filter bar */
  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }

  .filter-bar input {
    flex: 1; min-width: 140px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 4px;
    font-size: 0.85rem;
  }

  .filter-bar select {
    width: auto; flex: 0 0 auto;
  }

  /* grid */
  .furniture-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }

  .furniture-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
    transition: border-color 0.15s;
    position: relative;
  }

  .furniture-card:hover { border-color: var(--accent2); }

  .furniture-card img {
    width: 56px; height: 56px;
    object-fit: contain;
    image-rendering: pixelated;
    margin-bottom: 6px;
  }

  .furniture-card .name {
    font-size: 0.72rem;
    color: var(--text);
    line-height: 1.3;
    word-break: break-all;
  }

  .furniture-card .cat {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .furniture-card .qty-badge {
    position: absolute;
    top: 6px; right: 8px;
    background: var(--accent);
    color: #0f0e17;
    font-size: 0.65rem;
    font-weight: 700;
    font-family: var(--font-mono);
    padding: 1px 6px;
    border-radius: 10px;
  }

  .furniture-card .confidence {
    font-size: 0.6rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    margin-top: 4px;
  }

  /* empty state */
  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .empty-state .big { font-size: 2.5rem; margin-bottom: 12px; }

  /* progress bar */
  #progress-bar-wrap {
    height: 3px;
    background: var(--border);
    display: none;
  }

  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    width: 0%;
    transition: width 0.3s;
  }

  /* export buttons */
  .export-row {
    display: flex; gap: 8px; margin-bottom: 16px;
  }

  .export-row button {
    flex: 1;
    padding: 8px;
    font-size: 0.8rem;
  }

  /* scrollable results */
  #results-scroll {
    max-height: 70vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  #results-scroll::-webkit-scrollbar { width: 5px; }
  #results-scroll::-webkit-scrollbar-track { background: var(--surface); }
  #results-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="crystal"></div>
  <div>
    <h1>FF14 家具辨識器</h1>
    <p>上傳背包截圖，自動辨識持有家具</p>
  </div>
</header>

<div class="main">

  <!-- LEFT: upload + controls -->
  <div>
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">📂 上傳截圖</div>
      <div class="upload-area">
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="image/*">
          <div class="drop-hint-full">
            <div class="icon">🗂️</div>
            <p><strong>點擊選擇</strong>或拖曳圖片到此處</p>
            <p style="margin-top:6px;font-size:0.75rem">支援 PNG / JPG / WebP　或　<strong>Ctrl+V</strong> 貼上截圖</p>
          </div>
          <div class="drop-hint-mini">
            <span>🖼️</span>
            <span>重新選擇 / 拖曳 / <strong>Ctrl+V</strong></span>
          </div>
        </div>
      </div>

      <div id="preview-wrap">
        <div id="preview-header">
          <div>預覽　<span id="preview-size"></span></div>
          <button id="btn-preview-close" title="移除圖片">✕ 移除</button>
        </div>
        <div id="preview-canvas-wrap">
          <canvas id="preview-canvas"></canvas>
        </div>
      </div>
      </div>

      <div class="controls">
        <div>
          <label>pHash 比對門檻（越低越嚴格）</label>
          <div class="slider-row">
            <input type="range" id="threshold" min="5" max="30" value="15">
            <span class="slider-val" id="threshold-val">15</span>
          </div>
        </div>
        <div>
          <label>格子大小（像素）</label>
          <div class="slider-row">
            <input type="range" id="slot-size" min="20" max="80" value="43">
            <span class="slider-val" id="slot-size-val">43</span>
          </div>
        </div>
        <div>
          <label>格子間距（像素）</label>
          <div class="slider-row">
            <input type="range" id="slot-gap" min="0" max="20" value="3">
            <span class="slider-val" id="slot-gap-val">3</span>
          </div>
        </div>
        <div>
          <label>自動偵測格子 offset</label>
          <select id="detect-mode">
            <option value="auto">自動偵測（推薦）</option>
            <option value="manual">手動：從左上角 (0,0) 開始</option>
          </select>
        </div>

        <button class="btn-primary" id="btn-detect" disabled>🔍 開始辨識</button>
        <button class="btn-secondary" id="btn-clear">清除結果</button>
      </div>

      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <div id="status"><div class="dot"></div><span id="status-text">等待上傳圖片…</span></div>
    </div>

    <div class="panel">
      <div class="panel-title">📊 資料庫狀態</div>
      <div style="padding:14px 20px;font-size:0.8rem;color:var(--text-muted);font-family:var(--font-mono);">
        <div id="db-info">載入中…</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: results -->
  <div class="panel">
    <div class="panel-title">🪑 辨識結果</div>
    <div class="results-area">
      <div class="summary-row" id="summary-row"></div>
      <div class="export-row" id="export-row" style="display:none">
        <button class="btn-secondary" onclick="exportCSV()">⬇ 匯出 CSV</button>
        <button class="btn-secondary" onclick="exportJSON()">⬇ 匯出 JSON</button>
        <button class="btn-secondary" onclick="copyNames()">📋 複製名稱</button>
      </div>
      <div class="filter-bar" id="filter-bar" style="display:none">
        <input type="text" id="search-input" placeholder="搜尋家具名稱…" oninput="renderResults()">
        <select id="cat-filter" onchange="renderResults()">
          <option value="">全部類別</option>
        </select>
      </div>
      <div id="results-scroll">
        <div class="empty-state" id="empty-state">
          <div class="big">🏠</div>
          <div>上傳截圖後，辨識結果會顯示於此</div>
        </div>
        <div class="furniture-grid" id="furniture-grid"></div>
      </div>
    </div>
  </div>

</div>

<div id="paste-hint">📋 已貼上截圖</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const CATEGORY_MAP = {
  57:'室內家具', 64:'建設許可', 65:'屋頂', 66:'外牆', 67:'窗戶',
  68:'門', 69:'屋頂裝飾', 70:'外牆裝飾', 71:'門牌', 72:'圍欄',
  73:'內牆', 74:'地板', 75:'天花板燈', 76:'室外家具', 77:'桌子',
  78:'桌上擺件', 79:'壁掛', 80:'地毯', 95:'繪畫'
};

// ── State ────────────────────────────────────────────────────────────────────
let furnitureDB = [];    // [{id, name, category, categoryId, iconUrl}]
let hashDB = {};         // {id(string): Uint8Array(8)} — 從 hashes.json 載入，無需瀏覽器計算
let furnitureIndex = {}; // {id(string): furnitureDB item} — 快速查找
let detectedItems = [];  // [{id, name, category, iconUrl, qty, confidence}]
let uploadedImage = null;
let hashesReady = false; // hashes.json 是否已載入完畢

// ── DB Load ──────────────────────────────────────────────────────────────────
async function loadDB() {
  setStatus('loading', '載入家具資料庫…');
  try {
    // 並行 fetch furniture.json 和 hashes.json
    const [furRes, hashRes] = await Promise.all([
      fetch('data/furniture.json'),
      fetch('data/hashes.json'),
    ]);

    furnitureDB = await furRes.json();

    // 建立 id 快速查找表
    furnitureDB.forEach(item => { furnitureIndex[String(item.id)] = item; });

    // 解析 hashes.json：{id: hex字串} → {id: Uint8Array}
    const rawHashes = await hashRes.json();
    let hashCount = 0;
    for (const [id, hex] of Object.entries(rawHashes)) {
      const bytes = new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
      hashDB[id] = bytes;
      hashCount++;
    }
    hashesReady = true;

    document.getElementById('db-info').textContent =
      `家具：${furnitureDB.length} 筆 | Hash：${hashCount} 筆 | 類別：${Object.keys(CATEGORY_MAP).length} 種`;
    setStatus('ok', `資料庫就緒（${furnitureDB.length} 項家具，Hash 預載完畢）`);

    // populate category filter
    const sel = document.getElementById('cat-filter');
    const cats = [...new Set(furnitureDB.map(f => f.category))].sort();
    cats.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  } catch(e) {
    // hashes.json 可能不存在（第一次部署尚未產生），降級提示
    if (furnitureDB.length > 0 && !hashesReady) {
      document.getElementById('db-info').textContent =
        `家具：${furnitureDB.length} 筆 | ⚠️ hashes.json 未找到`;
      setStatus('error', '找不到 data/hashes.json，請執行 update_furniture.py 產生');
    } else {
      setStatus('error', '無法載入資料庫：' + e.message);
      document.getElementById('db-info').textContent = '載入失敗';
    }
  }
}

// ── pHash（前端格子 ＆ Python 家具圖示都用相同 pHash，結果才能互相比對）────────
// 使用行列分離 DCT：O(n²) 而非暴力 O(n⁴)，32×32 圖約 0.5ms，20格約 10ms
// 與 update_furniture.py 的 compute_phash() 輸出格式完全相同

const PHASH_SIZE = 32;
const PHASH_HSIZE = 8;

// 預建 DCT 係數（只算一次）
const _DCT = (() => {
  const n = PHASH_SIZE;
  const mat = new Float32Array(n * n);
  for (let u = 0; u < n; u++)
    for (let x = 0; x < n; x++)
      mat[u * n + x] = Math.cos((2*x + 1) * u * Math.PI / (2*n));
  return mat;
})();

function computeSlotHash(imageData) {
  const { data, width, height } = imageData;
  const N = PHASH_SIZE;

  // 1. Resize to N×N grayscale（最近鄰，夠快）
  const gray = new Float32Array(N * N);
  const sx = width / N, sy = height / N;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const px = Math.min(Math.floor(x * sx), width - 1);
      const py = Math.min(Math.floor(y * sy), height - 1);
      const i = (py * width + px) * 4;
      gray[y * N + x] = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
    }
  }

  // 2. 行 DCT（對每一行做 1D DCT）
  const rowDCT = new Float32Array(N * N);
  for (let r = 0; r < N; r++) {
    for (let u = 0; u < N; u++) {
      let sum = 0;
      for (let x = 0; x < N; x++)
        sum += gray[r * N + x] * _DCT[u * N + x];
      const cu = u === 0 ? 1 / Math.sqrt(2) : 1;
      rowDCT[r * N + u] = 0.5 * cu * sum;
    }
  }

  // 3. 列 DCT（對每一列做 1D DCT）→ 得到 2D DCT
  const dct2d = new Float32Array(N * N);
  for (let v = 0; v < N; v++) {
    for (let c = 0; c < N; c++) {
      let sum = 0;
      for (let y = 0; y < N; y++)
        sum += rowDCT[y * N + c] * _DCT[v * N + y];
      const cv = v === 0 ? 1 / Math.sqrt(2) : 1;
      dct2d[v * N + c] = 0.5 * cv * sum;
    }
  }

  // 4. 取左上角 PHASH_HSIZE×PHASH_HSIZE，與平均值比大小 → 64 bits
  const H = PHASH_HSIZE;
  const vals = new Float32Array(H * H);
  for (let u = 0; u < H; u++)
    for (let v = 0; v < H; v++)
      vals[u * H + v] = dct2d[u * N + v];

  let avg = 0;
  for (let i = 0; i < vals.length; i++) avg += vals[i];
  avg /= vals.length;

  const bytes = new Uint8Array(8);
  for (let i = 0; i < 64; i++)
    if (vals[i] > avg) bytes[i >> 3] |= (1 << (7 - (i & 7)));

  return bytes;
}

function hammingDistance(a, b) {
  let d = 0;
  for (let i = 0; i < a.length; i++) {
    let x = a[i] ^ b[i];
    x = x - ((x >> 1) & 0x55);
    x = (x & 0x33) + ((x >> 2) & 0x33);
    d += (((x + (x >> 4)) & 0x0f) * 0x01) & 0xff;
  }
  return d;
}

// ── Slot detection ────────────────────────────────────────────────────────────
function detectSlots(canvas) {
  const mode = document.getElementById('detect-mode').value;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, W, H).data;

  if (mode === 'auto') {
    // 自動偵測：找亮度低的行/列（深色邊框），推算格子邊界
    // 1. 計算每行/列平均亮度
    const rowBright = new Float32Array(H);
    const colBright = new Float32Array(W);
    for (let y = 0; y < H; y++) {
      let s = 0;
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        s += imgData[i]*0.299 + imgData[i+1]*0.587 + imgData[i+2]*0.114;
      }
      rowBright[y] = s / W;
    }
    for (let x = 0; x < W; x++) {
      let s = 0;
      for (let y = 0; y < H; y++) {
        const i = (y * W + x) * 4;
        s += imgData[i]*0.299 + imgData[i+1]*0.587 + imgData[i+2]*0.114;
      }
      colBright[x] = s / H;
    }

    // 2. 找「暗帶」中心（邊框位置）
    const rowAvg = rowBright.reduce((a,b)=>a+b) / H;
    const colAvg = colBright.reduce((a,b)=>a+b) / W;
    const rowThresh = rowAvg * 0.65;
    const colThresh = colAvg * 0.65;

    function findBorders(bright, thresh) {
      const borders = [];
      let inDark = false, darkStart = 0;
      for (let i = 0; i < bright.length; i++) {
        if (bright[i] < thresh && !inDark) { inDark = true; darkStart = i; }
        else if (bright[i] >= thresh && inDark) {
          borders.push(Math.round((darkStart + i - 1) / 2));
          inDark = false;
        }
      }
      if (inDark) borders.push(Math.round((darkStart + bright.length - 1) / 2));
      return borders;
    }

    const rowBorders = findBorders(rowBright, rowThresh);
    const colBorders = findBorders(colBright, colThresh);

    // 3. 如果找到至少 2 條邊框，用邊框之間的區域當格子
    if (rowBorders.length >= 2 && colBorders.length >= 2) {
      const slots = [];
      for (let i = 0; i < rowBorders.length - 1; i++) {
        for (let j = 0; j < colBorders.length - 1; j++) {
          const x = colBorders[j] + 1;
          const y = rowBorders[i] + 1;
          const w = colBorders[j+1] - x - 1;
          const h = rowBorders[i+1] - y - 1;
          if (w > 10 && h > 10) slots.push({ x, y, w, h });
        }
      }
      if (slots.length > 0) return slots;
    }
  }

  // fallback：用滑桿設定值
  const slotSize = parseInt(document.getElementById('slot-size').value);
  const slotGap  = parseInt(document.getElementById('slot-gap').value);
  const step = slotSize + slotGap;
  const slots = [];
  for (let y = 0; y + slotSize <= H; y += step)
    for (let x = 0; x + slotSize <= W; x += step)
      slots.push({ x, y, w: slotSize, h: slotSize });
  return slots;
}

// ── Identify ──────────────────────────────────────────────────────────────────
// 方案 B：所有家具 pHash 從 hashes.json 預載（hashDB），
//         對截圖格子算 pHash，再做純記憶體 Hamming Distance 比對
//         整個辨識流程 < 1 秒
async function identify() {
  if (!uploadedImage || furnitureDB.length === 0) return;

  if (!hashesReady) {
    setStatus('error', 'hashes.json 尚未載入，請執行 update_furniture.py 並推送');
    return;
  }

  const threshold = parseInt(document.getElementById('threshold').value);

  // 重繪截圖到 canvas
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = uploadedImage.naturalWidth;
  canvas.height = uploadedImage.naturalHeight;
  ctx.drawImage(uploadedImage, 0, 0);

  const slots = detectSlots(canvas);
  setStatus('loading', `偵測到 ${slots.length} 個格子，比對中…`);
  showProgress(0);

  // 預先把 hashDB 的 entries 轉成陣列，避免迴圈中重複 Object.entries()
  const hashEntries = Object.entries(hashDB); // [[id, Uint8Array], ...]

  const counts = {};
  const tmpCanvas = document.createElement('canvas');
  const tmpCtx = tmpCanvas.getContext('2d');

  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];

    // 擷取格子像素
    tmpCanvas.width = slot.w; tmpCanvas.height = slot.h;
    tmpCtx.drawImage(canvas, slot.x, slot.y, slot.w, slot.h, 0, 0, slot.w, slot.h);
    const slotHash = computeSlotHash(tmpCtx.getImageData(0, 0, slot.w, slot.h));

    // 畫偵測框（金色）
    ctx.strokeStyle = 'rgba(201,169,110,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(slot.x, slot.y, slot.w, slot.h);

    // 純記憶體比對：對所有預載 hash 做 Hamming Distance
    let bestDist = Infinity, bestId = null;
    for (let j = 0; j < hashEntries.length; j++) {
      const dist = hammingDistance(slotHash, hashEntries[j][1]);
      if (dist < bestDist) { bestDist = dist; bestId = hashEntries[j][0]; }
    }

    if (bestId !== null && bestDist <= threshold) {
      const item = furnitureIndex[bestId];
      if (item) {
        if (!counts[bestId]) {
          counts[bestId] = { item, count: 0, bestConf: bestDist };
        }
        counts[bestId].count++;
        counts[bestId].bestConf = Math.min(counts[bestId].bestConf, bestDist);

        // 綠色命中框
        ctx.fillStyle = 'rgba(110,202,160,0.18)';
        ctx.fillRect(slot.x, slot.y, slot.w, slot.h);
        ctx.strokeStyle = 'rgba(110,202,160,0.8)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(slot.x, slot.y, slot.w, slot.h);
      }
    }

    showProgress(Math.round((i+1)/slots.length*100));

    // 每 50 格 yield 一次（遠少於原本每 10 格，因為現在每格超快）
    if (i % 50 === 0) await new Promise(r => setTimeout(r, 0));
  }

  detectedItems = Object.values(counts).map(c => ({
    id: c.item.id,
    name: c.item.name,
    category: c.item.category,
    categoryId: c.item.categoryId,
    iconUrl: `icons/${c.item.id}.png`,
    qty: c.count,
    confidence: c.bestConf,
  }));

  hideProgress();
  const total = detectedItems.reduce((a,b)=>a+b.qty,0);
  setStatus('ok', `辨識完成：${detectedItems.length} 種家具，共 ${total} 個`);
  renderResults();
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults() {
  const grid = document.getElementById('furniture-grid');
  const empty = document.getElementById('empty-state');
  const exportRow = document.getElementById('export-row');
  const filterBar = document.getElementById('filter-bar');
  const summaryRow = document.getElementById('summary-row');

  const query = (document.getElementById('search-input').value || '').toLowerCase();
  const catF  = document.getElementById('cat-filter').value;

  let items = detectedItems.filter(i => {
    if (query && !i.name.toLowerCase().includes(query)) return false;
    if (catF && i.category !== catF) return false;
    return true;
  });

  if (detectedItems.length === 0) {
    empty.style.display = ''; grid.innerHTML = '';
    exportRow.style.display = 'none'; filterBar.style.display = 'none';
    summaryRow.innerHTML = '';
    return;
  }

  empty.style.display = 'none';
  exportRow.style.display = 'flex'; filterBar.style.display = 'flex';

  // summary chips
  const total = detectedItems.reduce((a,b)=>a+b.qty,0);
  const cats = {};
  detectedItems.forEach(i => cats[i.category] = (cats[i.category]||0) + i.qty);
  let html = `<div class="chip">共 <span>${detectedItems.length}</span> 種</div>`;
  html += `<div class="chip">總數量 <span>${total}</span></div>`;
  Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c,n]) => {
    html += `<div class="chip">${c} <span>${n}</span></div>`;
  });
  summaryRow.innerHTML = html;

  // cards
  grid.innerHTML = '';
  items.sort((a,b) => b.qty - a.qty || a.name.localeCompare(b.name));
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'furniture-card';
    card.innerHTML = `
      <div class="qty-badge">×${item.qty}</div>
      <img src="${item.iconUrl}" alt="${item.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\'><rect width=\\'56\\' height=\\'56\\' fill=\\'%23231f32\\'/></svg>'">
      <div class="name">${item.name}</div>
      <div class="cat">${item.category}</div>
      <div class="confidence">距離 ${item.confidence}</div>
    `;
    grid.appendChild(card);
  });
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = [['ID','名稱','類別','數量','最佳距離']];
  detectedItems.forEach(i => rows.push([i.id, i.name, i.category, i.qty, i.confidence]));
  const csv = rows.map(r => r.map(v=>`"${v}"`).join(',')).join('\n');
  download('furniture_result.csv', csv, 'text/csv');
}

function exportJSON() {
  download('furniture_result.json', JSON.stringify(detectedItems, null, 2), 'application/json');
}

function copyNames() {
  const text = detectedItems.map(i=>`${i.name} ×${i.qty}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>setStatus('ok','已複製到剪貼簿'));
}

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = type;
  document.getElementById('status-text').textContent = msg;
}

function showProgress(pct) {
  document.getElementById('progress-bar-wrap').style.display = '';
  document.getElementById('progress-bar').style.width = pct + '%';
}

function hideProgress() {
  document.getElementById('progress-bar-wrap').style.display = 'none';
}

// ── File upload ───────────────────────────────────────────────────────────────
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      uploadedImage = img;
      showPreview(img);
      document.getElementById('btn-detect').disabled = false;
      setStatus('ok', `已載入：${img.naturalWidth}×${img.naturalHeight} px`);
      detectedItems = [];
      renderResults();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleBlob(blob) {
  if (!blob || !blob.type.startsWith('image/')) return;
  handleFile(blob);
}

function showPreview(img) {
  const wrap   = document.getElementById('preview-wrap');
  const canvas = document.getElementById('preview-canvas');
  const sizeEl = document.getElementById('preview-size');
  const dz     = document.getElementById('drop-zone');

  canvas.width  = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.getContext('2d').drawImage(img, 0, 0);

  sizeEl.textContent = `${img.naturalWidth} × ${img.naturalHeight} px`;
  wrap.style.display = '';
  dz.classList.add('has-image');
}

function clearAll() {
  uploadedImage = null;
  detectedItems = [];
  const wrap = document.getElementById('preview-wrap');
  const dz   = document.getElementById('drop-zone');
  wrap.style.display = 'none';
  dz.classList.remove('has-image');
  document.getElementById('btn-detect').disabled = true;
  renderResults();
  setStatus('', '已清除，等待上傳圖片…');
}

// ── Paste (Ctrl+V) ────────────────────────────────────────────────────────────
let pasteToastTimer = null;
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const blob = item.getAsFile();
      handleBlob(blob);
      showPasteToast();
      break;
    }
  }
});

function showPasteToast() {
  const el = document.getElementById('paste-hint');
  el.classList.add('show');
  clearTimeout(pasteToastTimer);
  pasteToastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── Drag & drop ───────────────────────────────────────────────────────────────
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});
document.getElementById('file-input').addEventListener('change', e => handleFile(e.target.files[0]));

// ── Preview close button ──────────────────────────────────────────────────────
document.getElementById('btn-preview-close').addEventListener('click', clearAll);

// ── Sliders ───────────────────────────────────────────────────────────────────
['threshold','slot-size','slot-gap'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    document.getElementById(id+'-val').textContent = e.target.value;
  });
});

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-detect').addEventListener('click', identify);
document.getElementById('btn-clear').addEventListener('click', clearAll);

// ── Init ──────────────────────────────────────────────────────────────────────
loadDB();
</script>
</body>
</html>
