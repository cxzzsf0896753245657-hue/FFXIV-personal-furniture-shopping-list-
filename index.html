<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 家具庫存管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap');
  :root {
    --bg:#0f0e17; --surface:#1a1825; --surface2:#231f32; --border:#2e2a42;
    --gold:#c9a96e; --gold-dim:#7a6240; --blue:#5a9fd4; --blue-dim:#2c5070;
    --text:#e8e4f0; --text-dim:#8a849e; --red:#ca6e7b; --green:#6ecaa0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px;min-height:100vh}

  /* HEADER */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:14px}
  .crystal{width:30px;height:30px;background:linear-gradient(135deg,#7b6ea0,#c9a96e);clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);flex-shrink:0}
  header h1{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);letter-spacing:2px}
  header .sub{color:var(--text-dim);font-size:11px;margin-left:auto}

  /* LAYOUT */
  .layout{display:grid;grid-template-columns:210px 1fr 300px;height:calc(100vh - 52px);overflow:hidden}

  /* SIDEBAR */
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .sidebar-head{padding:11px 14px;font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .char-list{flex:1;overflow-y:auto;padding:6px}
  .char-item{padding:9px 11px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s;margin-bottom:2px;border-left:3px solid transparent}
  .char-item:hover{background:var(--surface2)}
  .char-item.active{background:var(--surface2);border-left-color:var(--gold)}
  .char-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .char-name{font-size:12px;color:var(--text);font-weight:500}
  .char-count{font-size:10px;color:var(--text-dim);margin-top:1px}
  .char-add{margin:6px;padding:8px;border:1px dashed var(--border);border-radius:6px;text-align:center;cursor:pointer;color:var(--text-dim);font-size:12px;transition:all .15s}
  .char-add:hover{border-color:var(--gold-dim);color:var(--gold)}

  /* MAIN */
  .main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .toolbar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--surface);flex-shrink:0}
  .search-wrap{flex:1;position:relative}
  .search-wrap input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 10px 7px 30px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border .15s}
  .search-wrap input:focus{border-color:var(--blue-dim)}
  .search-wrap input::placeholder{color:var(--text-dim)}
  .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;pointer-events:none}
  .cat-bar{display:flex;gap:5px;padding:7px 14px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;background:var(--surface)}
  .cat-bar::-webkit-scrollbar{height:3px}
  .cat-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .cbt{padding:3px 10px;border-radius:16px;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:11px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
  .cbt:hover{border-color:var(--gold-dim);color:var(--gold)}
  .cbt.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
  .item-grid{flex:1;overflow-y:auto;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;align-content:start}
  .item-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;position:relative}
  .item-card:hover{border-color:var(--blue-dim);background:var(--surface2)}
  .item-card.has{border-color:var(--gold-dim)}
  .item-card.has::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .iico{width:38px;height:38px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;overflow:hidden}
  .iico img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  .iico-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-dim)}
  .iinfo{flex:1;min-width:0}
  .iname{font-size:11px;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .icat{font-size:10px;color:var(--text-dim);margin-top:1px}
  .iqty{font-size:13px;font-weight:700;color:var(--gold);min-width:18px;text-align:right}

  /* PANEL */
  .panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .ptabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
  .ptab{flex:1;padding:10px;text-align:center;font-size:11px;cursor:pointer;color:var(--text-dim);border-bottom:2px solid transparent;transition:all .15s}
  .ptab.active{color:var(--gold);border-bottom-color:var(--gold)}
  .pcontent{flex:1;overflow-y:auto;padding:10px}

  /* INV LIST */
  .ii{display:flex;align-items:center;gap:7px;padding:7px;border-radius:5px;margin-bottom:3px;transition:background .1s}
  .ii:hover{background:var(--surface2)}
  .ii-ico{width:26px;height:26px;border-radius:3px;background:var(--surface2);flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
  .ii-ico img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  .ii-ico-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim)}
  .ii-name{flex:1;font-size:11px;color:var(--text)}
  .qw{display:flex;align-items:center;gap:3px}
  .qb{width:18px;height:18px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .1s}
  .qb:hover{border-color:var(--gold-dim);color:var(--gold)}
  .qn{width:28px;text-align:center;font-size:12px;font-weight:600;color:var(--gold);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:1px 0;outline:none}
  .qn:focus{border-color:var(--blue-dim)}
  .idel{width:16px;height:16px;border-radius:3px;border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:color .1s}
  .idel:hover{color:var(--red)}

  /* SUMMARY */
  .si-item{padding:9px 7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
  .si-ico{width:30px;height:30px;border-radius:3px;background:var(--surface2);flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
  .si-ico img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  .si-ico-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim)}
  .si-name{flex:1;font-size:11px;color:var(--text)}
  .si-chars{font-size:10px;color:var(--text-dim);margin-top:1px}
  .si-total{font-size:14px;font-weight:700;color:var(--gold);min-width:24px;text-align:right}

  /* EMPTY */
  .empty{text-align:center;padding:36px 16px;color:var(--text-dim)}
  .empty .ei{font-size:28px;margin-bottom:8px}
  .empty p{font-size:11px;line-height:1.6}

  /* MODAL */
  .mo{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100}
  .mo.show{display:flex}
  .md{background:var(--surface);border:1px solid var(--gold-dim);border-radius:10px;padding:22px;width:300px}
  .md h3{font-family:'Cinzel',serif;color:var(--gold);font-size:14px;margin-bottom:14px}
  .md input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:11px}
  .md input:focus{border-color:var(--gold-dim)}
  .ep{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
  .eo{width:32px;height:32px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:border-color .1s}
  .eo.sel{border-color:var(--gold)}
  .mbtns{display:flex;gap:7px;justify-content:flex-end}
  .btn{padding:7px 16px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
  .btn-p{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
  .btn-p:hover{background:var(--gold);color:var(--bg)}
  .btn-g{background:none;color:var(--text-dim)}
  .btn-g:hover{color:var(--text)}

  /* QTY POPUP */
  .qp{position:fixed;background:var(--surface);border:1px solid var(--gold-dim);border-radius:8px;padding:13px;z-index:200;width:190px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.6)}
  .qp.show{display:block}
  .qp-name{font-size:11px;color:var(--gold);margin-bottom:9px;font-weight:500;line-height:1.3}
  .qp-row{display:flex;align-items:center;gap:7px}
  .qp input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;text-align:center}
  .qp input:focus{border-color:var(--gold-dim)}
  .qp-acts{display:flex;gap:5px;margin-top:9px}
  .qp-acts .btn{flex:1;padding:6px;text-align:center;font-size:11px}

  /* EXPORT */
  .export-bar{padding:9px 10px;border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0}
  .export-bar .btn{flex:1;text-align:center;font-size:10px;padding:5px}

  /* LOADING */
  .loading{text-align:center;padding:36px;color:var(--text-dim);font-size:13px}
  .badge{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 5px;color:var(--text-dim)}

  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
</style>
</head>
<body>

<header>
  <div class="crystal"></div>
  <h1>Housing Inventory</h1>
  <span class="sub">FF14 多角色家具庫存管理</span>
</header>

<div class="layout">

  <!-- 左：角色 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span>角色</span>
      <span class="badge" id="char-badge">0</span>
    </div>
    <div class="char-list" id="char-list"></div>
    <div class="char-add" onclick="openAddChar()">＋ 新增角色</div>
  </div>

  <!-- 中：家具清單 -->
  <div class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="si">🔍</span>
        <input type="text" id="search-input" placeholder="搜尋家具名稱…" oninput="renderItems()">
      </div>
    </div>
    <div class="cat-bar" id="cat-bar"></div>
    <div class="item-grid" id="item-grid">
      <div class="loading" style="grid-column:1/-1">載入家具資料庫中…</div>
    </div>
  </div>

  <!-- 右：庫存 -->
  <div class="panel">
    <div class="ptabs">
      <div class="ptab active" onclick="switchTab('inv')" id="tab-inv">目前角色</div>
      <div class="ptab" onclick="switchTab('sum')" id="tab-sum">全角色彙整</div>
    </div>
    <div class="pcontent" id="pcontent"></div>
    <div class="export-bar">
      <button class="btn btn-g" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn btn-g" onclick="exportJSON()">⬇ JSON</button>
    </div>
  </div>

</div>

<!-- 新增角色 modal -->
<div class="mo" id="mo">
  <div class="md">
    <h3>新增角色</h3>
    <input type="text" id="char-name-inp" placeholder="角色名稱" maxlength="30">
    <div style="font-size:10px;color:var(--text-dim);margin-bottom:7px">選擇圖示</div>
    <div class="ep" id="ep"></div>
    <div class="mbtns">
      <button class="btn btn-g" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="addChar()">新增</button>
    </div>
  </div>
</div>

<!-- 數量 popup -->
<div class="qp" id="qp">
  <div class="qp-name" id="qp-name"></div>
  <div class="qp-row">
    <button class="qb" onclick="adjPopup(-1)">－</button>
    <input type="number" id="qp-inp" min="0" max="999" value="1">
    <button class="qb" onclick="adjPopup(1)">＋</button>
  </div>
  <div class="qp-acts">
    <button class="btn btn-g" onclick="closeQP()">取消</button>
    <button class="btn btn-p" onclick="confirmQP()">確認</button>
  </div>
</div>

<script>
// ─ 資料來源（直接用你 GitHub Pages 的 furniture.json 和 icons/）
const BASE = 'https://cxzzsf0896753245657-hue.github.io/FFXIV-personal-furniture-shopping-list-';
const DATA_URL  = BASE + '/data/furniture.json';
const ICON_URL  = id => BASE + '/icons/' + id + '.png';

// ─ 狀態
let chars    = JSON.parse(localStorage.getItem('ff14_chars') || '[]');
let inventory= JSON.parse(localStorage.getItem('ff14_inv')   || '{}');
let activeChar= null;
let activeTab = 'inv';
let allItems  = [];
let activeCat = 'all';
let selEmoji  = '⚔️';
let popItem   = null;

const EMOJIS = ['⚔️','🛡️','🌸','🐉','🌙','⭐','🏰','🌊','🔮','💎','🦋','🌺'];

// ─ 載入家具資料
async function loadItems(){
  try{
    const res = await fetch(DATA_URL);
    if(!res.ok) throw new Error(res.status);
    const raw = await res.json();
    // furniture.json 格式：[{id, name, category, categoryId, ...}]
    allItems = raw
      .filter(i => i.name && i.name.trim())
      .sort((a,b) => a.name.localeCompare(b.name,'zh-TW'));
    buildCatBar();
    renderItems();
  }catch(e){
    document.getElementById('item-grid').innerHTML =
      '<div class="loading" style="grid-column:1/-1;color:#ca6e7b">⚠ 無法載入家具資料：'+e.message+'</div>';
  }
}

// ─ 類別篩選
function buildCatBar(){
  const cats = ['all', ...new Set(allItems.map(i=>i.category||'其他'))];
  document.getElementById('cat-bar').innerHTML = cats.map(c=>
    `<button class="cbt${c===activeCat?' active':''}" onclick="setCat('${c}')">${c==='all'?'全部':c}</button>`
  ).join('');
}
function setCat(c){ activeCat=c; buildCatBar(); renderItems(); }

// ─ 家具卡片
function renderItems(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const grid = document.getElementById('item-grid');
  if(!activeChar){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="ei">👤</div><p>請先選擇或新增角色</p></div>';
    return;
  }
  const inv = inventory[activeChar.id]||{};
  const list = allItems.filter(i=>{
    const matchCat = activeCat==='all'||(i.category||'其他')===activeCat;
    const matchQ   = !q || i.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  if(!list.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="ei">🔍</div><p>沒有符合的家具</p></div>';
    return;
  }
  grid.innerHTML = list.map(item=>{
    const qty = inv[item.id]||0;
    return `<div class="item-card${qty>0?' has':''}" onclick="openQP(event,${item.id})">
      <div class="iico"><img src="${ICON_URL(item.id)}" loading="lazy"
        onerror="this.parentNode.innerHTML='<div class=iico-ph>🪑</div>'">
      </div>
      <div class="iinfo">
        <div class="iname">${item.name}</div>
        <div class="icat">${item.category||''}</div>
      </div>
      ${qty>0?`<div class="iqty">${qty}</div>`:''}
    </div>`;
  }).join('');
}

// ─ 數量 popup
function openQP(e, itemId){
  if(!activeChar) return;
  e.stopPropagation();
  popItem = allItems.find(i=>i.id===itemId||i.id==itemId);
  const inv = inventory[activeChar.id]||{};
  const qty = inv[itemId]||inv[String(itemId)]||0;
  document.getElementById('qp-name').textContent = popItem.name;
  document.getElementById('qp-inp').value = qty;
  const pop = document.getElementById('qp');
  pop.classList.add('show');
  const r = e.currentTarget.getBoundingClientRect();
  let top=r.bottom+4, left=r.left;
  if(left+195>window.innerWidth) left=window.innerWidth-200;
  if(top+150>window.innerHeight) top=r.top-154;
  pop.style.top=top+'px'; pop.style.left=left+'px';
  setTimeout(()=>document.getElementById('qp-inp').select(),40);
}
function adjPopup(d){
  const i=document.getElementById('qp-inp');
  i.value=Math.max(0,(parseInt(i.value)||0)+d);
}
function confirmQP(){
  if(!activeChar||!popItem) return;
  const qty=Math.max(0,parseInt(document.getElementById('qp-inp').value)||0);
  const id=String(popItem.id);
  if(!inventory[activeChar.id]) inventory[activeChar.id]={};
  if(qty===0) delete inventory[activeChar.id][id];
  else inventory[activeChar.id][id]=qty;
  save(); closeQP(); renderItems(); renderPanel(); renderChars();
}
function closeQP(){ document.getElementById('qp').classList.remove('show'); popItem=null; }
document.addEventListener('click',e=>{ if(!document.getElementById('qp').contains(e.target)) closeQP(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('qp').classList.contains('show')) confirmQP();
  if(e.key==='Escape') closeQP();
});

// ─ 角色
function renderChars(){
  document.getElementById('char-badge').textContent=chars.length;
  const el=document.getElementById('char-list');
  if(!chars.length){
    el.innerHTML='<div style="padding:14px;color:var(--text-dim);font-size:11px;text-align:center">尚無角色</div>';
    return;
  }
  el.innerHTML=chars.map(c=>{
    const inv=inventory[c.id]||{};
    const kinds=Object.keys(inv).length;
    const total=Object.values(inv).reduce((a,b)=>a+b,0);
    return `<div class="char-item${activeChar?.id===c.id?' active':''}" onclick="selChar('${c.id}')">
      <div class="char-avatar">${c.emoji}</div>
      <div><div class="char-name">${c.name}</div><div class="char-count">${kinds}種・${total}件</div></div>
    </div>`;
  }).join('');
}
function selChar(id){
  activeChar=chars.find(c=>c.id===id);
  renderChars(); renderItems(); renderPanel();
}
function openAddChar(){
  document.getElementById('char-name-inp').value='';
  selEmoji=EMOJIS[0];
  document.getElementById('ep').innerHTML=EMOJIS.map(e=>
    `<div class="eo${e===selEmoji?' sel':''}" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
  document.getElementById('mo').classList.add('show');
  setTimeout(()=>document.getElementById('char-name-inp').focus(),80);
}
function pickEmoji(e){ selEmoji=e; document.querySelectorAll('.eo').forEach(el=>el.classList.toggle('sel',el.textContent===e)); }
function addChar(){
  const name=document.getElementById('char-name-inp').value.trim();
  if(!name) return;
  const c={id:Date.now().toString(),name,emoji:selEmoji};
  chars.push(c); save(); closeModal(); renderChars();
  if(!activeChar) selChar(c.id);
}
function closeModal(){ document.getElementById('mo').classList.remove('show'); }
document.getElementById('char-name-inp').addEventListener('keydown',e=>{ if(e.key==='Enter') addChar(); });

// ─ 右側面板
function switchTab(t){
  activeTab=t;
  document.getElementById('tab-inv').classList.toggle('active',t==='inv');
  document.getElementById('tab-sum').classList.toggle('active',t==='sum');
  renderPanel();
}
function renderPanel(){ activeTab==='inv'?renderInv():renderSum(); }

function renderInv(){
  const el=document.getElementById('pcontent');
  if(!activeChar){ el.innerHTML='<div class="empty"><div class="ei">👤</div><p>請先選擇角色</p></div>'; return; }
  const inv=inventory[activeChar.id]||{};
  const entries=Object.entries(inv).filter(([,q])=>q>0);
  if(!entries.length){ el.innerHTML='<div class="empty"><div class="ei">📦</div><p>此角色尚無庫存<br>點擊中間的家具來新增</p></div>'; return; }
  el.innerHTML=entries.map(([id,qty])=>{
    const item=allItems.find(i=>String(i.id)===id);
    if(!item) return '';
    return `<div class="ii">
      <div class="ii-ico"><img src="${ICON_URL(item.id)}" loading="lazy"
        onerror="this.parentNode.innerHTML='<div class=ii-ico-ph>🪑</div>'">
      </div>
      <div class="ii-name">${item.name}</div>
      <div class="qw">
        <button class="qb" onclick="adjInv('${id}',-1)">－</button>
        <input class="qn" type="number" value="${qty}" min="0"
          onblur="setInv('${id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
        <button class="qb" onclick="adjInv('${id}',1)">＋</button>
      </div>
      <button class="idel" onclick="delInv('${id}')" title="移除">✕</button>
    </div>`;
  }).join('');
}
function adjInv(id,d){
  if(!activeChar) return;
  const inv=inventory[activeChar.id]||{};
  const nv=Math.max(0,(inv[id]||0)+d);
  if(nv===0) delete inv[id]; else inv[id]=nv;
  inventory[activeChar.id]=inv;
  save(); renderInv(); renderItems(); renderChars();
}
function setInv(id,val){
  if(!activeChar) return;
  const nv=Math.max(0,parseInt(val)||0);
  if(!inventory[activeChar.id]) inventory[activeChar.id]={};
  if(nv===0) delete inventory[activeChar.id][id];
  else inventory[activeChar.id][id]=nv;
  save(); renderInv(); renderItems(); renderChars();
}
function delInv(id){
  if(!activeChar) return;
  delete (inventory[activeChar.id]||{})[id];
  save(); renderInv(); renderItems(); renderChars();
}

function renderSum(){
  const el=document.getElementById('pcontent');
  const totals={};
  chars.forEach(c=>{
    Object.entries(inventory[c.id]||{}).forEach(([id,qty])=>{
      if(!totals[id]) totals[id]={total:0,chars:[]};
      totals[id].total+=qty;
      totals[id].chars.push(`${c.emoji}${c.name}×${qty}`);
    });
  });
  const entries=Object.entries(totals).sort((a,b)=>b[1].total-a[1].total);
  if(!entries.length){ el.innerHTML='<div class="empty"><div class="ei">📊</div><p>尚無庫存資料</p></div>'; return; }
  el.innerHTML=entries.map(([id,data])=>{
    const item=allItems.find(i=>String(i.id)===id);
    if(!item) return '';
    return `<div class="si-item">
      <div class="si-ico"><img src="${ICON_URL(item.id)}" loading="lazy"
        onerror="this.parentNode.innerHTML='<div class=si-ico-ph>🪑</div>'">
      </div>
      <div><div class="si-name">${item.name}</div><div class="si-chars">${data.chars.join('・')}</div></div>
      <div class="si-total">${data.total}</div>
    </div>`;
  }).join('');
}

// ─ 匯出
function exportCSV(){
  let csv='角色,家具名稱,類別,數量\n';
  chars.forEach(c=>{
    Object.entries(inventory[c.id]||{}).forEach(([id,qty])=>{
      const item=allItems.find(i=>String(i.id)===id);
      if(item) csv+=`"${c.name}","${item.name}","${item.category||''}",${qty}\n`;
    });
  });
  dl('ff14_inventory.csv',csv,'text/csv');
}
function exportJSON(){
  const out=chars.map(c=>({char:c.name,inventory:Object.entries(inventory[c.id]||{}).map(([id,qty])=>{
    const item=allItems.find(i=>String(i.id)===id);
    return{name:item?.name,cat:item?.category,qty};
  }).filter(x=>x.name)}));
  dl('ff14_inventory.json',JSON.stringify(out,null,2),'application/json');
}
function dl(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+content],{type}));
  a.download=name; a.click();
}

// ─ 存檔
function save(){
  localStorage.setItem('ff14_chars',JSON.stringify(chars));
  localStorage.setItem('ff14_inv',JSON.stringify(inventory));
}

// ─ 初始化
renderChars();
if(chars.length) selChar(chars[0].id);
else renderPanel();
loadItems();
</script>
</body>
</html>
